_version: 2
# Interface strings, looked up with `rust_i18n::t!` (see `src/i18n.rs`).
#
# Every key needs every language: `i18n::tests` fails on a missing one.
# A value that places something keeps it inside the sentence as `%{name}`,
# so a translation can move it.
#
# Keys under `gpui_component` override gpui-kit's own component strings;
# their names must match the component crate's `locales/ui.yml` exactly.

