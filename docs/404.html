<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0E1420">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌉</text></svg>">
    <title>Page Not Found - CloudBridge</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            color: #47536B;
            background: #FAFBFC;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        :root {
            --ink: #0E1420;
            --hairline: #E3E8EF;
            --fg-strong: #101828;
            --fg-faint: #7A8699;
            --signal: #2F6FED;
            --signal-dark: #1F5BD8;
            --local: #2FA97C;
            --radius: 6px;
        }

        nav {
            height: 4.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--hairline);
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--fg-strong);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .logo::before {
            content: '';
            width: 0.6rem;
            height: 0.6rem;
            background: var(--local);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
        }

        .code {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 5rem;
            font-weight: 500;
            color: var(--local);
            line-height: 1;
            margin-bottom: 1.25rem;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--fg-strong);
            margin-bottom: 0.75rem;
        }

        p {
            max-width: 30rem;
            margin: 0 auto 2.5rem;
        }

        .links {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.6rem;
            border-radius: var(--radius);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 0.9375rem;
            text-decoration: none;
            border: 1px solid transparent;
            transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--signal);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--signal-dark);
        }

        .btn-outline {
            color: var(--signal);
            border-color: var(--signal);
        }

        .btn-outline:hover {
            background: var(--signal);
            color: #fff;
        }

        a:focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 2px;
        }

        @media (max-width: 768px) {
            .code {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <nav aria-label="Main navigation">
        <a href="/cloudbridge/" class="logo">CloudBridge</a>
    </nav>
    <main>
        <div>
            <div class="code">404</div>
            <h1 data-i18n="notfound.title">This page moved or never existed.</h1>
            <p data-i18n="notfound.desc">The link may be outdated, or the URL may have a typo. Here's where you can go instead:</p>
            <div class="links">
                <a href="/cloudbridge/" class="btn btn-primary" data-i18n="notfound.home">Home</a>
                <a href="/cloudbridge/#download" class="btn btn-outline" data-i18n="notfound.download">Download</a>
                <a href="/cloudbridge/#faq" class="btn btn-outline" data-i18n="notfound.faq">FAQ</a>
                <a href="https://github.com/JetSquirrel/cloudbridge" target="_blank" rel="noopener noreferrer" class="btn btn-outline">GitHub</a>
            </div>
        </div>
    </main>

    <!-- Same i18n scaffolding as index.html; see that file for how to add a locale. -->
    <script>
        (function () {
            var LOCALES = {
                en: {} // default: strings live in the markup
            };

            function applyLocale(locale) {
                var dict = LOCALES[locale];
                if (!dict) return;
                document.querySelectorAll('[data-i18n]').forEach(function (el) {
                    var key = el.getAttribute('data-i18n');
                    if (typeof dict[key] === 'string') el.textContent = dict[key];
                });
                document.documentElement.lang = locale;
            }

            var saved = null;
            try { saved = localStorage.getItem('cloudbridge-locale'); } catch (e) {}
            var browser = (navigator.language || 'en').slice(0, 2);
            applyLocale(saved && LOCALES[saved] ? saved : (LOCALES[browser] ? browser : 'en'));
        })();
    </script>
</body>
</html>
