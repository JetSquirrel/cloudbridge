<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#3B82F6">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌉</text></svg>">
    <title>Page Not Found - CloudBridge</title>

    <!-- Outfit Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            color: #111827;
            background: #FFFFFF;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        :root {
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --fg-gray-600: #4B5563;
            --border: #E5E7EB;
            --radius-md: 6px;
        }

        nav {
            padding: 0 1rem;
            height: 5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
        }

        h1 {
            font-size: 6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }

        p {
            color: var(--fg-gray-600);
            max-width: 32rem;
            margin: 0 auto 2.5rem;
        }

        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.875rem 1.75rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            border: 2px solid transparent;
            transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--primary);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-outline {
            color: var(--primary);
            border-color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: #FFFFFF;
        }

        a:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <nav aria-label="Main navigation">
        <a href="/cloudbridge/" class="logo">CloudBridge</a>
    </nav>
    <main>
        <div>
            <h1>404</h1>
            <h2>This page moved or never existed.</h2>
            <p>The link may be outdated, or the URL may have a typo. Here's where you can go instead:</p>
            <div class="links">
                <a href="/cloudbridge/" class="btn btn-primary">Home</a>
                <a href="/cloudbridge/#download" class="btn btn-outline">Download</a>
                <a href="/cloudbridge/#faq" class="btn btn-outline">FAQ</a>
                <a href="https://github.com/JetSquirrel/cloudbridge" target="_blank" rel="noopener noreferrer" class="btn btn-outline">GitHub</a>
            </div>
        </div>
    </main>
</body>
</html>
