name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'web/**'
      - 'www/**'
      - 'scripts/**'
      - 'rust-toolchain*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'web/**'
      - 'www/**'
      - 'scripts/**'
      - 'rust-toolchain*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        # Only three crates in the tree reach outside Rust on Linux:
        # `yeslogic-fontconfig-sys` probes fontconfig with pkg-config (and
        # freetype alongside it), while the X11 backend links xkbcommon and
        # xcb directly. Everything else is pure Rust or dlopen'd.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Check compilation
        run: cargo check
      - name: Tests
        run: cargo test

  wasm:
    name: Web demo (advisory until web sources are tracked)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check web build prerequisites
        id: web
        shell: bash
        run: |
          if [[ -f web/smol-bridge/Cargo.toml && -f scripts/build-web.sh && -d www/fonts ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping web build: web demo sources or fonts are not present in this checkout."
            echo "Web build skipped: commit the web demo sources, build script and fonts to enable it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: dtolnay/rust-toolchain@nightly
        if: steps.web.outputs.available == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.web.outputs.available == 'true'
        with:
          key: wasm
      - name: Install matching wasm-bindgen CLI
        if: steps.web.outputs.available == 'true'
        shell: bash
        run: |
          version=$(python3 - <<'PY'
          import pathlib
          import tomllib

          lock = tomllib.loads(pathlib.Path("Cargo.lock").read_text())
          versions = {p["version"] for p in lock["package"] if p["name"] == "wasm-bindgen"}
          if len(versions) != 1:
              raise SystemExit("Expected exactly one wasm-bindgen version in Cargo.lock")
          print(versions.pop())
          PY
          )
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build web demo
        if: steps.web.outputs.available == 'true'
        run: ./scripts/build-web.sh

  msrv:
    name: Minimum supported Rust version (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        # Same set as the `check` job — a second runner needs them installed
        # a second time.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev
      - name: Read declared Rust version
        id: msrv
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          print(f"version={manifest['package']['rust-version']}")
          PY
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Check compilation on declared MSRV
        run: cargo check --locked

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        # Same set as the `check` job. `cargo geiger` compiles the tree to
        # report on it, so without these it dies in the fontconfig build
        # script — and the `|| true` further down would turn that into a
        # silently empty report rather than a failure.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      
      # Audit dependencies for known vulnerabilities
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Security audit
        run: cargo audit
      
      # Check for outdated dependencies
      - name: Install cargo-outdated
        run: cargo install cargo-outdated
      - name: Check outdated dependencies
        run: cargo outdated --exit-code 1 || true  # Don't fail CI, just report
      
      # Detect unsafe code usage
      - name: Install cargo-geiger
        run: cargo install cargo-geiger
      - name: Unsafe code report
        run: cargo geiger --all-features || true  # Report only, don't fail
