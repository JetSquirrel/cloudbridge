[package]
name = "cloudbridge"
version = "0.3.2"
edition = "2021"
description = "A cross-platform desktop application for multi-cloud cost management"
authors = ["JetSquirrel"]
license = "MIT"
repository = "https://github.com/JetSquirrel/cloudbridge"
readme = "README.md"
keywords = ["cloud", "cost-management", "aws", "aliyun", "finops"]
categories = ["gui", "finance"]
rust-version = "1.75"

[dependencies]
# GPUI Kit: the single dependency for GPUI, gpui-base, the styled
# components and the default assets. Default features are `component` and
# `assets`; the tree-sitter grammars stay off, so no syntax-highlighting
# stack is compiled into a cost dashboard.
gpui-kit = "0.6"

# Sync HTTP client (avoids aws-lc-sys compilation issues)
ureq = { version = "3", features = ["json"] }

# Run blocking operations in GPUI async context
smol = "2"

# AWS signing
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"  # Aliyun signing
hex = "0.4"

# Database. `json` and `parquet` compile those extensions into the binary
# rather than letting duckdb autoload a downloaded dylib at runtime: under
# the hardened runtime, library validation refuses to map an extension
# signed by another team, so autoloading fails with "different Team IDs".
# The tag rollups need JSON; the raw store writes and re-reads Parquet.
duckdb = { version = "1", features = ["bundled", "json", "parquet"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encryption (for AK/SK secure storage)
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"

# OS keyring for secure secret storage (Windows Credential Manager / macOS Keychain / Linux Secret Service)
# Using v2.3 for better stability on Windows
keyring = "2.3"

# Time handling
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
directories = "6"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Lazy initialization
lazy_static = "1"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"          # Optimize for size
lto = true               # Link-time optimization
strip = true             # Strip symbols
panic = "abort"          # Smaller panic handling
codegen-units = 1        # Better optimization

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3            # Optimize dependencies in dev mode for faster iteration
