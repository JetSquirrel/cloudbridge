    zh-CN: "%{name}：每 1M token 的综合单价从 %{from} 涨到 %{to}，同期支出从 %{prev} 变为 %{now}"
  cost_only:
    en: "Cost only — no token metering"
    zh-CN: "仅有成本——无 token 计量"
