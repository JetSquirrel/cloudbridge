    en: Open at login
    zh-CN: 登录时打开
  open_at_login_hint_menu_bar:
    en: Starts CloudBridge in the menu bar when you log in, without its window, so alerts keep arriving after a restart.
    zh-CN: 登录时在菜单栏中启动 CloudBridge，不打开窗口，重启后也能继续收到告警。
  open_at_login_hint:
    en: Starts CloudBridge when you log in, so alerts keep arriving after a restart.
    zh-CN: 登录时启动 CloudBridge，重启后也能继续收到告警。
  open_at_login_failed:
    en: "Could not change Open at login: %{error}"
    zh-CN: 无法更改“登录时打开”：%{error}
  keep_in_menu_bar:
    en: Keep running in the menu bar
    zh-CN: 在菜单栏中保持运行
  keep_in_tray:
    en: Keep running in the notification area
    zh-CN: 在通知区域中保持运行
  open_at_login_hint_tray:
    en: Starts CloudBridge in the notification area when you log in, without its window, so alerts keep arriving after a restart.
    zh-CN: 登录时在通知区域中启动 CloudBridge，不打开窗口，重启后也能继续收到告警。
  keep_in_tray_hint:
    en: Closing the window leaves CloudBridge in the notification area, showing the month's spend, so refreshes and alerts carry on. Off, closing the window quits.
    zh-CN: 关闭窗口后 CloudBridge 仍留在通知区域并显示本月支出，刷新和告警会继续。关闭此项时，关闭窗口即退出。
  keep_in_menu_bar_hint:
    en: Closing the window leaves CloudBridge in the menu bar, showing the month's spend, so refreshes and alerts carry on. Off, closing the window quits.
    zh-CN: 关闭窗口后 CloudBridge 仍留在菜单栏并显示本月支出，刷新和告警会继续。关闭此项时，关闭窗口即退出。
  background_refresh:
    en: Refresh in the background
    zh-CN: 后台刷新
  background_refresh_hint_menu_bar:
    en: While CloudBridge runs, window open or closed, it fetches each account once its refresh interval has passed and runs the alert rules. It looks for a due account every 15 minutes, without contacting the provider.
    zh-CN: CloudBridge 运行期间（无论窗口是否打开），会在每个账户的刷新间隔过后获取数据并运行告警规则。它每 15 分钟检查一次是否有到期账户，检查时不会联系云服务商。
  background_refresh_hint:
    en: While CloudBridge is open, it fetches each account once its refresh interval has passed and runs the alert rules. It looks for a due account every 15 minutes, without contacting the provider.
    zh-CN: CloudBridge 打开期间，会在每个账户的刷新间隔过后获取数据并运行告警规则。它每 15 分钟检查一次是否有到期账户，检查时不会联系云服务商。
  alert_notifications:
    en: Alert notifications
    zh-CN: 告警通知
  alert_notifications_hint:
    en: Posts a system notification when an alert fires, once per alert.
    zh-CN: 告警触发时发送系统通知，每条告警一次。
  export_focus:
    en: Export as FOCUS
    zh-CN: 导出为 FOCUS
  export_focus_hint:
    en: "Every charge as a CSV with FOCUS 1.5 column names, for another FinOps tool: amounts in the currency each was billed in, and a model's tokens as ConsumedQuantity and SkuPriceDetails."
    zh-CN: 将所有费用导出为使用 FOCUS 1.5 列名的 CSV，供其他 FinOps 工具使用：金额保留各自的计费货币，模型的 token 写入 ConsumedQuantity 和 SkuPriceDetails。
