    zh-CN: "最新余额快照"
  d_monthly:
    en: "Total billed spend per billing month, in reporting currency."
    zh-CN: "每个账期的计费支出总额，以报表货币计。"
  d_provider_month:
    en: "How each month's spend splits across providers, in reporting currency."
    zh-CN: "每月支出在各服务商之间的分布，以报表货币计。"
  d_daily_30:
    en: "Day-by-day spend over the last 30 days, in reporting currency."
    zh-CN: "最近 30 天的每日支出，以报表货币计。"
  d_top_services:
    en: "Which services cost the most this billing month, in reporting currency."
    zh-CN: "本账期花费最多的服务，以报表货币计。"
  d_business_line:
    en: "How spend splits across business lines, in reporting currency; charges without the business_line tag count as Unallocated."
    zh-CN: "支出在各业务线之间的分布，以报表货币计；没有 business_line 标签的费用计为未分配。"
  d_unallocated:
    en: "Which services carry no business_line tag, and what they cost, in reporting currency."
    zh-CN: "哪些服务没有 business_line 标签，以及它们的花费，以报表货币计。"
  d_forecast:
    en: "This month's spend to date, the daily run rate since the first charge, and the projected month-end total, in reporting currency."
    zh-CN: "本月至今支出、自首笔费用以来的日均速率，以及预计的月末总额，以报表货币计。"
  d_mom:
    en: "This month vs last month per service, in reporting currency, biggest movers first."
    zh-CN: "各服务本月与上月对比，以报表货币计，变动最大的排在前面。"
  d_region:
    en: "How this billing month's spend splits across regions, in reporting currency; charges with no region count as Other."
    zh-CN: "本账期支出在各地域之间的分布，以报表货币计；没有地域的费用计为其他。"
  d_category:
    en: "How this billing month's spend splits across FOCUS service categories — the same categories on every cloud — in reporting currency; charges no mapping places count as Uncategorized."
    zh-CN: "本账期支出在各 FOCUS 服务类别（所有云统一的类别）之间的分布，以报表货币计；未能映射的费用计为未分类。"
  d_top_resources:
    en: "The individual resources costing the most this billing month, in reporting currency."
    zh-CN: "本账期花费最多的单个资源，以报表货币计。"
  d_discount:
    en: "List-price spend vs actually billed spend per service this month, in reporting currency — how much discounts and credits shave off."
    zh-CN: "本月各服务的标价支出与实际计费支出对比，以报表货币计——看折扣和抵扣省下了多少。"
  d_ingest:
    en: "The 20 most recent ingest runs, with their channel, status, and row count."
    zh-CN: "最近 20 次导入运行，含渠道、状态和行数。"
  d_balances:
    en: "Each account's most recently observed balance, one row per currency at that instant."
    zh-CN: "每个账户最近一次观测到的余额，该时刻每种货币一行。"

