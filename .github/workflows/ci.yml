name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'web/**'
      - 'scripts/**'
      - 'rust-toolchain*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'web/**'
      - 'scripts/**'
      - 'rust-toolchain*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        # Only three crates in the tree reach outside Rust on Linux:
        # `yeslogic-fontconfig-sys` probes fontconfig with pkg-config (and
        # freetype alongside it), while the X11 backend links xkbcommon and
        # xcb directly. Everything else is pure Rust or dlopen'd.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Check compilation
        run: cargo check
      - name: Tests
        run: cargo test

  wasm:
    name: Web demo (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The nightly is pinned, not floating: `gpui-pre-web` needs an unstable
      # feature, and a nightly that renames one would otherwise break this job
      # on a day nobody touched the project. Keep it in step with
      # WEB_TOOLCHAIN in scripts/build-web.sh.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-28
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Install the wasm-bindgen CLI the lock file names
        run: |
          version="$(./scripts/locked-version.py wasm-bindgen)"
          cargo install wasm-bindgen-cli --version "$version" --locked
      # This is what keeps `src/ui/`, `app.rs` and `alerts.rs` compiling for
      # both targets: the two data backends answer the same signatures, and
      # nothing but this build notices when one of them drifts.
      - name: Build web demo
        run: ./scripts/build-web.sh

  msrv:
    name: Minimum supported Rust version (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        # Same set as the `check` job — a second runner needs them installed
        # a second time.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev
      - name: Read declared Rust version
        id: msrv
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          print(f"version={manifest['package']['rust-version']}")
          PY
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Check compilation on declared MSRV
        run: cargo check --locked

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        # Same set as the `check` job. `cargo geiger` compiles the tree to
        # report on it, so without these it dies in the fontconfig build
        # script — and the `|| true` further down would turn that into a
        # silently empty report rather than a failure.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      
      # Audit dependencies for known vulnerabilities
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Security audit
        run: cargo audit
      
      # Check for outdated dependencies
      - name: Install cargo-outdated
        run: cargo install cargo-outdated
      - name: Check outdated dependencies
        run: cargo outdated --exit-code 1 || true  # Don't fail CI, just report
      
      # Detect unsafe code usage
      - name: Install cargo-geiger
        run: cargo install cargo-geiger
      - name: Unsafe code report
        run: cargo geiger --all-features || true  # Report only, don't fail
