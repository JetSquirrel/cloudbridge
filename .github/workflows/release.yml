name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact_name: cloudbridge.exe
            asset_name: cloudbridge-windows-x64.exe
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: cloudbridge
            asset_name: cloudbridge-macos-arm64.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A manual run builds the tag when it already exists, and otherwise
      # the branch it was dispatched from — the release job then creates
      # the tag there. The input is read through env, never pasted into the
      # script, and may be given with or without the leading `v`.
      - name: Check out the release tag and verify it matches Cargo.toml
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v${INPUT_VERSION#v}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Not a release version: $TAG" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
            && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --detach "$TAG"
          fi
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup Windows SDK (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Find the latest Windows SDK with x64 fxc.exe
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $sdkVersions = Get-ChildItem -Path $sdkRoot -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object Name -Descending
          
          foreach ($sdk in $sdkVersions) {
            $fxcPath = Join-Path $sdk.FullName "x64\fxc.exe"
            if (Test-Path $fxcPath) {
              Write-Host "Found Windows SDK: $($sdk.Name)"
              Write-Host "Using fxc.exe at: $fxcPath"
              $sdkBinPath = Join-Path $sdk.FullName "x64"
              echo $sdkBinPath >> $env:GITHUB_PATH
              break
            }
          }
          
          # Verify fxc.exe is accessible
          Write-Host "PATH will include SDK bin directory for shader compilation"

      - name: Install macOS dependencies (macOS only)
        if: runner.os == 'macOS'
        run: |
          # Install any required macOS dependencies
          brew install cmake

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "${{ matrix.asset_name }}"

      - name: Import signing certificate (macOS only)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          # A throwaway keychain for this run: importing into the runner's
          # login keychain would leave a distribution private key behind
          # for whatever runs next.
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$NOTARY_KEY_BASE64" | base64 --decode -o "$NOTARY_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PWD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # codesign runs non-interactively here; without a partition list
          # the keychain would pop a GUI prompt that nobody can answer.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed -e 's/"//g')

          rm -f "$CERTIFICATE_PATH"

          echo "NOTARY_KEY=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Prepare artifact (macOS)
        if: runner.os == 'macOS'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          scripts/package-macos.sh \
            "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" \
            "${{ matrix.asset_name }}" \
            "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    # No `if: always()`: a macOS job that failed to sign or notarize must
    # fail the whole release, not ship a half-empty one.
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: |
          echo "Checking artifacts directory..."
          if [ -d "artifacts" ]; then
            ls -la artifacts/
            find artifacts -type f
          else
            echo "No artifacts directory found"
          fi

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=v${INPUT_VERSION#v}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: CloudBridge ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/cloudbridge-windows-x64.exe/cloudbridge-windows-x64.exe
            artifacts/cloudbridge-macos-arm64.dmg/cloudbridge-macos-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
